name: Deploy Web App to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (strict, warnings are errors)
        run: npx tsc --noEmit

      - name: Lint (warnings are errors)
        run: npx eslint 'src/**/*.ts' --max-warnings 0

      - name: Format check
        run: npm run format:check

      - name: Unit tests (browser services, warnings are errors)
        run: npm run test:web

      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Build web bundle (production, fail on warnings)
        run: npm run build:web

      - name: Stage static site
        run: |
          cp styles.css web/styles.css
          mkdir -p _site
          cp -r web/* _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
