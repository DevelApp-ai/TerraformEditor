name: Deploy Web App to GitHub Pages

# Deploys both Pages slots from the repository state:
#   - /            <- main branch build
#   - /dev/        <- dev branch build (dev channel)
# Both slots are rebuilt on every run of this workflow so the published
# site is always deterministic regardless of which branch triggered it.
on:
  push:
    branches: ['main', 'dev']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags for semver evaluation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (strict, warnings are errors)
        run: npx tsc --noEmit

      - name: Lint (warnings are errors)
        run: npx eslint 'src/**/*.ts' --max-warnings 0

      - name: Format check
        run: npm run format:check

      - name: Unit tests (warnings are errors)
        run: npm run test:web

      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Build main channel (root slot)
        run: npm run build:web -- --env PUBLIC_PATH=/TerraformEditor/

      - name: Stage main slot
        run: |
          mkdir -p _site
          cp styles.css web/styles.css
          cp -r web/index.html web/renderer.js* web/styles.css web/media _site/ 2>/dev/null || true
          cp -r web/index.html web/renderer.js web/styles.css _site/
          rm -rf web/renderer.js web/renderer.js.map web/renderer.js.LICENSE.txt web/styles.css web/media

      - name: Fetch dev branch
        run: git fetch origin dev --depth=1

      - name: Build dev channel (/dev/ slot)
        run: |
          git checkout origin/dev -- src tests styles.css index.html web/index.html package.json package-lock.json tsconfig.json tsconfig.test.json webpack.web.config.js webpack.config.js eslint.config.js
          npm ci
          npm run build:web -- --env PUBLIC_PATH=/TerraformEditor/dev/
          cp styles.css web/styles.css
          mkdir -p _site/dev
          cp -r web/index.html web/renderer.js web/styles.css web/media _site/dev/ 2>/dev/null || true
          cp -r web/index.html web/renderer.js web/styles.css _site/dev/
          rm -rf web/renderer.js web/renderer.js.map web/renderer.js.LICENSE.txt web/styles.css web/media

      - name: Evaluate next semver
        id: semver
        run: |
          set +e
          VERSION=$(node scripts/next-semver.js)
          CODE=$?
          set -e
          if [ "$CODE" = "3" ]; then
            echo "Tag already exists (idempotent re-run); keeping existing version"
          elif [ "$CODE" != "0" ]; then
            exit $CODE
          fi
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp site with channel versions
        run: |
          MAIN_VERSION=$(git tag --list "v*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//') || MAIN_VERSION=0.0.0
          echo "main: ${MAIN_VERSION}" > _site/VERSION.txt
          echo "dev: ${{ steps.semver.outputs.version }}" >> _site/VERSION.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
