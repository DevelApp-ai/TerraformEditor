name: Automatic Semver Release

# On push to main/dev:
#   - dev  -> next patch prerelease tag (vX.Y.Z+1-dev.N), GitHub prerelease
#   - main -> next stable tag (vX.Y.Z+1), GitHub release
#
# Two-stage design: a single linux job evaluates the version, pushes the
# tag, and creates the release, then hands the exact version to the
# upload job via job outputs. Upload runners never evaluate or poll for
# tags - concurrent/polling approaches raced and uploaded installers to
# the wrong release.
on:
  push:
    branches: ['main', 'dev']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - name: Checkout (full history + tags for semver evaluation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Evaluate next semver
        id: semver
        run: |
          set +e
          VERSION=$(node scripts/next-semver.js)
          CODE=$?
          set -e
          if [ "$CODE" = "3" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" != "0" ]; then
            exit $CODE
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        run: |
          if [ "${{ steps.semver.outputs.exists }}" = "true" ]; then
            echo "Tag already exists (idempotent re-run); skipping creation"
            exit 0
          fi
          VERSION="${{ steps.semver.outputs.version }}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automatic release $TAG"
          git push origin "$TAG"
          PRERELEASE=false
          if [[ "$VERSION" == *"-dev."* ]]; then
            PRERELEASE=true
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Automatic release from branch: ${GITHUB_REF_NAME}." \
            --prerelease="$PRERELEASE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package Electron app
        run: npx electron-builder build --${{ matrix.platform }} --publish never

      - name: Upload installers to the release
        run: |
          TAG="v${{ needs.create-release.outputs.version }}"
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.rpm)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers found for ${{ matrix.platform }}"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
