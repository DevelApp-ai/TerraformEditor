name: Automatic Semver Release

# On push to main/dev:
#   - dev  -> next patch prerelease tag (vX.Y.Z+1-dev.N), GitHub prerelease
#   - main -> next stable tag (vX.Y.Z+1), GitHub release
# Electron installers are built and attached in this same workflow, because
# pushes made with GITHUB_TOKEN do not trigger other workflows (so a
# separate tag-triggered workflow would never fire).
on:
  push:
    branches: ['main', 'dev']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (full history + tags for semver evaluation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Evaluate next semver
        id: semver
        run: |
          set +e
          VERSION=$(node scripts/next-semver.js)
          CODE=$?
          set -e
          if [ "$CODE" = "3" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" != "0" ]; then
            exit $CODE
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Create tag and release (once, from linux runner)
        if: matrix.platform == 'linux' && steps.semver.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automatic release $TAG"
          git push origin "$TAG"
          PRERELEASE=false
          if [[ "$VERSION" == *"-dev."* ]]; then
            PRERELEASE=true
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Automatic release from branch: ${GITHUB_REF_NAME}." \
            --prerelease="$PRERELEASE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Wait for release to exist (non-linux runners)
        if: matrix.platform != 'linux'
        run: |
          TAG="v${{ steps.semver.outputs.version }}"
          for i in $(seq 1 30); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "Release $TAG did not appear in time"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Package Electron app
        run: npx electron-builder build --${{ matrix.platform }} --publish never

      - name: Upload installers to the release
        run: |
          TAG="v${{ steps.semver.outputs.version }}"
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.rpm)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers found for ${{ matrix.platform }}"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
