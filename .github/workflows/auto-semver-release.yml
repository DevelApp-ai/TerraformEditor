name: Automatic Semver Release

# On push to main/dev:
#   - dev  -> next patch prerelease tag (vX.Y.Z+1-dev.N), GitHub prerelease
#   - main -> next stable tag (vX.Y.Z+1), GitHub release
# Electron installers are built and attached in this same workflow, because
# pushes made with GITHUB_TOKEN do not trigger other workflows (so a
# separate tag-triggered workflow would never fire).
#
# Concurrency design: ONLY the linux runner evaluates the next version,
# pushes the tag, and creates the release. The other runners then derive
# the version from the tag that linux pushed (git describe), avoiding the
# race where concurrent matrix jobs computed different versions from the
# same starting tag state.
on:
  push:
    branches: ['main', 'dev']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (full history + tags for semver evaluation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Evaluate next semver (linux only)
        if: matrix.platform == 'linux'
        id: semver
        run: |
          set +e
          VERSION=$(node scripts/next-semver.js)
          CODE=$?
          set -e
          if [ "$CODE" = "3" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" != "0" ]; then
            exit $CODE
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Create tag and release (linux only)
        if: matrix.platform == 'linux'
        run: |
          if [ "${{ steps.semver.outputs.exists }}" = "true" ]; then
            echo "Tag already exists (idempotent re-run); skipping creation"
            exit 0
          fi
          VERSION="${{ steps.semver.outputs.version }}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automatic release $TAG"
          git push origin "$TAG"
          PRERELEASE=false
          if [[ "$VERSION" == *"-dev."* ]]; then
            PRERELEASE=true
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Automatic release from branch: ${GITHUB_REF_NAME}." \
            --prerelease="$PRERELEASE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Resolve released version (non-linux runners)
        if: matrix.platform != 'linux'
        id: released
        run: |
          # Wait for the linux runner to push the new tag, then derive the
          # version from the tag closest to this commit (never evaluate
          # semver independently - that raced in concurrent matrix jobs).
          for i in $(seq 1 60); do
            git fetch origin --tags --prune --force > /dev/null 2>&1
            TAG=$(git describe --tags --abbrev=0 2> /dev/null || true)
            if [ -n "$TAG" ]; then
              echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "No release tag appeared in time"
          exit 1
        shell: bash

      - name: Package Electron app
        run: npx electron-builder build --${{ matrix.platform }} --publish never

      - name: Upload installers to the release
        run: |
          if [ "${{ matrix.platform }}" = "linux" ] && [ "${{ steps.semver.outputs.exists }}" = "true" ]; then
            TAG="v${{ steps.semver.outputs.version }}"
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            TAG="v${{ steps.semver.outputs.version }}"
          else
            TAG="v${{ steps.released.outputs.version }}"
          fi
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.rpm)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers found for ${{ matrix.platform }}"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
